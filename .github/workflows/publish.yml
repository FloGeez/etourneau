name: Publish to npm

# A v* tag publishes the package at that version, through npm trusted publishing (no token).
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check that the package has the tag's version
        run: node -e "const v = require('./package.json').version; if (v !== process.argv[1]) { console.error('package.json is ' + v + ', not ' + process.argv[1]); process.exit(1); }" "${GITHUB_REF_NAME#v}"

      - name: Check that the generated files are up to date
        run: |
          npm run tokens
          npm run sprite
          npm run profile
          git diff --exit-code

      # a version already on npm is skipped: the first release is published by hand, and a half-done run can be replayed
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "etourneau@$version" version > /dev/null 2>&1; then echo "etourneau@$version is already on npm, skipped"
          else npm publish; fi

      # after npm, so that a release never announces a version npm does not have; skipped if it already exists, so a run can be replayed
      - name: Create GitHub Release
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
